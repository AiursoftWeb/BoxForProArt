version: "3.9"

services:
  app:
    depends_on:
      - db
    image: hub.aiursoft.com/aiursoft/nopkg:latest
    volumes:
      - nopkg-data:/data
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=nopkg;Uid=nopkg;Pwd={{NOPKG_DB_PASSWORD}};
      - ConnectionStrings__DbType=MySql
      - Storage__Path=/data/files
      - Registry__Upstream=https://registry.npmjs.org
      - Registry__StoragePath=/data/npm
      - Registry__CacheOnly=false
      - Registry__S360__Enabled=true
      - Registry__S360__PolicySource=https://nopkg.aiursoft.com/npm
      - Registry__S360__Server=https://s360.aiursoft.com
      - Registry__S360__CheckKey={{NOPKG_S360_CHECK_KEY}}
      - AppSettings__AuthProvider=OIDC
      - AppSettings__OIDC__Authority=https://auth.aiursoft.com/application/o/nopkg
      - AppSettings__OIDC__ClientId={{NOPKG_CLIENT_ID}}
      - AppSettings__OIDC__ClientSecret={{NOPKG_CLIENT_SECRET}}
      - Logging__Clickhouse__Enabled=true
      - Logging__Clickhouse__ConnectionString=Host=clickhouse;User=default;Password=123456;Database=AspNetCoreLogs
      - Logging__Clickhouse__TableName=NopkgLogs
    networks:
      - proxy_app
      - internal
      - clickhouse_net
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      # Cache writes are per process; never overlap writers to the package store.
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
      update_config:
        order: stop-first
        delay: 60s

  db:
    image: hub.aiursoft.com/mysql:9.7.0
    command: --skip-log-bin
    volumes:
      - nopkg-db:/var/lib/mysql
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=nopkg
      - MYSQL_USER=nopkg
      - MYSQL_PASSWORD={{NOPKG_DB_PASSWORD}}
    networks:
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s

volumes:
  nopkg-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ssd/nopkg-data/data
  nopkg-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ssd/nopkg-data/mysql

networks:
  proxy_app:
    external: true
  clickhouse_net:
    external: true
  internal:
    driver: overlay
