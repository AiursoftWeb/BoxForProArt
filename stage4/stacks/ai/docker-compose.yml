version: '3.9'

services:
  ollama-server:
    image: hub.aiursoft.com/ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - internal
    # 用 entrypoint wrapper 在启动前创建 CUDA 后端 symlink
    # 根因: ollama v0.31.x 将 libggml-cuda.so 放在 cuda_v12/cuda_v13 子目录，
    # 但 llama-server 的 ggml_backend_load_all() 只搜 /usr/lib/ollama/ 和 /，
    # 不搜子目录。OLLAMA_LIBRARY_PATH 只被 Go 代码用，llama-server C 代码不读。
    # 修复: 启动前把 cuda_v13 的 so 文件 symlink 到 ollama 主目录。
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ln -sf /usr/lib/ollama/cuda_v13/libggml-cuda.so /usr/lib/ollama/libggml-cuda.so
        ln -sf /usr/lib/ollama/cuda_v13/libcudart.so.13 /usr/lib/ollama/libcudart.so.13
        ln -sf /usr/lib/ollama/cuda_v13/libcublas.so.13 /usr/lib/ollama/libcublas.so.13
        ln -sf /usr/lib/ollama/cuda_v13/libcublasLt.so.13 /usr/lib/ollama/libcublasLt.so.13
        ln -sf /usr/lib/ollama/cuda_v13/libcudart.so.13.0.96 /usr/lib/ollama/libcudart.so.13.0.96
        ln -sf /usr/lib/ollama/cuda_v13/libcublas.so.13.1.1.3 /usr/lib/ollama/libcublas.so.13.1.1.3
        ln -sf /usr/lib/ollama/cuda_v13/libcublasLt.so.13.1.1.3 /usr/lib/ollama/libcublasLt.so.13.1.1.3
        exec /bin/ollama serve
    environment:
    # - OLLAMA_NUM_CTX=32768      # ❌ 必须删掉这行！否则向量模型也会默认去申请 32K，导致显存规划错乱。
      - OLLAMA_MAX_LOADED_MODELS=2  # ✅ 新增这行！明确告诉 Ollama 的调度器：我有钱，请允许同时把 2 个模型常驻在显存里，不要互相踢。
      - OLLAMA_NUM_BATCH=2048
      - OLLAMA_SCHED_SPREAD=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=-1        # ✅ 保持不变，永久驻留
      - OLLAMA_LOAD_TIMEOUT=15m
      - OLLAMA_DEBUG=1
      - OLLAMA_NUM_PARALLEL=1       # ✅ 保持单并发生成，防止抢夺 KV Cache
      - GIN_MODE=release
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '8.0'
          memory: 50G
        reservations:
          generic_resources:
            - discrete_resource_spec:
                kind: "NVIDIA-GPU"
                value: 0
            - discrete_resource_spec:
                kind: "NVIDIA-GPU"
                value: 1
      replicas: 1
      update_config:
        order: stop-first
        delay: 60s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3

  ollama-gateway-app:
    depends_on:
      - ollama-gateway-db
    image: hub.aiursoft.com/aiursoft/ollamagateway
    volumes:
      - ollama-gateway-aspnet:/data/.aspnet/
      - ollama-gateway-files:/data/files
    environment:
      - ConnectionStrings__DefaultConnection=Server=ollama-gateway-db;Database=ollama_gateway;Uid=ollama_gateway;Pwd=<ollama_gateway_password>;
      - ConnectionStrings__DbType=MySql
      - Storage__Path=/data/files
      - AppSettings__AuthProvider=OIDC
      - AppSettings__OIDC__Authority=https://auth.aiursoft.com/application/o/ollama-gateway
      - AppSettings__OIDC__ClientId={{OLLAMA_GATEWAY_CLIENT_ID}}
      - AppSettings__OIDC__ClientSecret={{OLLAMA_GATEWAY_CLIENT_SECRET}}
      - Logging__Clickhouse__Enabled=true
      - Logging__Clickhouse__ConnectionString=Host=clickhouse;User=default;Password=123456;Database=AspNetCoreLogs
      - Logging__Clickhouse__TableName=OllamaGatewayLogs
      - Clickhouse__Enabled=true
      - Clickhouse__ConnectionString=Host=clickhouse;Protocol=http;Port=8123;User=default;Password=123456;Database=default
      - Clickhouse__TableName=RequestLogs
    networks:
      - proxy_app
      - internal
      - clickhouse_net
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '6.0'
          memory: 8G
      update_config:
        order: start-first
        delay: 5s

  ollama-gateway-db:
    image: hub.aiursoft.com/mysql:9.7.0
    command: --skip-log-bin
    volumes:
      - ollama-gateway-db:/var/lib/mysql
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=ollama_gateway
      - MYSQL_USER=ollama_gateway
      - MYSQL_PASSWORD=<ollama_gateway_password>
    networks:
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s

  code-runner:
    image: hub.aiursoft.com/aiursoft/cpprunner
    volumes:
      - code-runner-aspnet-data:/data/.aspnet
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    environment:
      - DockerImageSettings__Prefix=hub.aiursoft.com
    networks:
      - internal
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      replicas: 2
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
      update_config:
        order: start-first
        delay: 5s

  mcpo:
    depends_on:
      - code-runner
    image: hub.aiursoft.com/ghcr.io/open-webui/mcpo:main
    networks:
      - internal
    volumes:
      - mcpo-data:/data
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '6.0'
          memory: 6G
      update_config:
        order: start-first
        delay: 5s
    entrypoint: ["mcpo", "--config", "/data/config.json"]

  open-webui:
    depends_on:
      - mcpo
      - ollama-gateway-app
    image: hub.aiursoft.com/ghcr.io/open-webui/open-webui:main
    environment:
      - 'OLLAMA_BASE_URL=http://ollama-gateway-app:5000/'
      - ENABLE_OPENAI_API=False
      - WEBUI_AUTH=True
      - ENABLE_LOGIN_FORM=False
      - ENABLE_SIGNUP=False
      - DEFAULT_USER_ROLE=user
      - SHOW_ADMIN_DETAILS=False
      - ENABLE_COMMUNITY_SHARING=False
      - ENABLE_MESSAGE_RATING=False
      - ENABLE_TAGS_GENERATION=False
      - ENABLE_EVALUATION_ARENA_MODELS=False
      - USER_PERMISSIONS_CHAT_FILE_UPLOAD=False
      - USER_PERMISSIONS_CHAT_TEMPORARY=False
      - ENABLE_OAUTH_SIGNUP=True
      - ENABLE_OAUTH_ROLE_MANAGEMENT=True
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=True
      - OAUTH_ADMIN_ROLES=openweb-admins
      - OAUTH_PROVIDER_NAME=Aiursoft
      - OAUTH_ROLES_CLAIM=groups
      - 'OPENID_PROVIDER_URL=https://auth.aiursoft.com/application/o/openwebchat/.well-known/openid-configuration'
      - OAUTH_CLIENT_ID={{OPENWEB_CLIENT_ID}}
      - OAUTH_CLIENT_SECRET={{OPENWEB_CLIENT_SECRET}}
      - 'OAUTH_SCOPES=openid email profile'
      - OPENID_REDIRECT_URI=https://openweb.aiursoft.com/oauth/oidc/callback
      - OAUTH_UPDATE_NAME_ON_LOGIN=True
      - OAUTH_UPDATE_PICTURE_ON_LOGIN=True
      - OAUTH_UPDATE_EMAIL_ON_LOGIN=True
      - OAUTH_ALLOWED_ROLES=user
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - proxy_app
      - internal
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8080/health | grep -q '\"status\":true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 480s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '6.0'
          memory: 6G
      update_config:
        order: stop-first
        delay: 60s

networks:
  internal:
    driver: overlay
  proxy_app:
    external: true
  clickhouse_net:
    external: true

volumes:
  ollama-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ai/ollama/data
  code-runner-aspnet-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ai/code-runner/aspnet
  mcpo-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ai/mcpo
  open-webui-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ai/open-webui/data
  ollama-gateway-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ollama-gateway-data/files
  ollama-gateway-aspnet:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ollama-gateway-data/aspnet
  ollama-gateway-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ollama-gateway-data/mysql
