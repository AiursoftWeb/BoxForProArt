version: '3.9'

services:
  gitlab:
    image: hub.aiursoft.com/gitlab/gitlab-ee
    ports:
      - target: 2202
        published: 2202
        protocol: tcp
        mode: host
    networks:
      - proxy_app
      - internal
    volumes:
      - gitlab-data:/var/opt/gitlab
      - gitlab-log:/var/log/gitlab
      - gitlab-config:/etc/gitlab
      - /etc/localtime:/etc/localtime:ro
      - type: bind
        source: /dev/shm
        target: /dev/shm
        read_only: false
    tmpfs:
      - /tmp:size=1024m
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.aiursoft.com'
        gitlab_rails['gitlab_shell_ssh_port'] = 2202
        gitlab_rails['gitlab_ssh_host'] = 'ssh.aiursoft.com'
        gitlab_sshd['enable'] = true
        gitlab_sshd['listen_address'] = '[::]:2202'
        gitlab_rails['gitlab_default_theme'] = 2
        letsencrypt['enabled'] = false
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        nginx['redirect_http_to_https'] = false
        nginx['proxy_protocol'] = false
        nginx['http2_enabled'] = true
        nginx['real_ip_trusted_addresses'] = ['10.0.0.0/8']
        nginx['real_ip_header'] = 'X-Forwarded-For'
        nginx['real_ip_recursive'] = 'on'
        gitlab_rails['omniauth_allow_single_sign_on'] = ['openid_connect']
        gitlab_rails['omniauth_sync_email_from_provider'] = 'openid_connect'
        gitlab_rails['omniauth_sync_profile_from_provider'] = ['openid_connect']
        gitlab_rails['omniauth_sync_profile_attributes'] = ['email']
        gitlab_rails['omniauth_auto_sign_in_with_provider'] = 'openid_connect'
        gitlab_rails['omniauth_block_auto_created_users'] = false
        gitlab_rails['omniauth_auto_link_user'] = ['openid_connect']
        gitlab_rails['omniauth_allow_bypass_two_factor'] = ['openid_connect']
        gitlab_rails['omniauth_providers'] = [
          {
            name: 'openid_connect',
            label: 'Aiursoft Login',
            args: {
              name: 'openid_connect',
              scope: ['openid','profile','email','groups'],
              response_type: 'code',
              issuer: 'https://auth.aiursoft.com/application/o/gitlab/',
              discovery: true,
              client_auth_method: 'query',
              uid_field: 'preferred_username',
              send_scope_to_token_endpoint: 'true',
              pkce: true,
              client_options: {
                identifier: '{{GITLAB_CLIENT_ID}}',
                secret: '{{GITLAB_CLIENT_SECRET}}',
                redirect_uri: 'https://gitlab.aiursoft.com/users/auth/openid_connect/callback',
                gitlab: {
                  admin_groups: ["gitlab-admins"],
                  groups_attribute: "groups"
                }
              }
            }
          }
        ]
        puma['worker_processes'] = 2
        puma['min_threads'] = 1
        puma['max_threads'] = 4
        puma['exporter_enabled'] = false
        sidekiq['concurrency'] = 2
        sidekiq['max_concurrency'] = 10
        sidekiq['min_concurrency'] = nil
        sidekiq['metrics_enabled'] = false
        postgresql['shared_buffers'] = "256MB"
        prometheus['enable'] = false
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false
        node_exporter['enable'] = false
        gitlab_exporter['enable'] = false
        gitlab_rails['smtp_enable'] = true
        gitlab_rails['smtp_address'] = "mail.aiursoft.com"
        gitlab_rails['smtp_port'] = 587
        gitlab_rails['smtp_user_name'] = "service@aiursoft.com"
        gitlab_rails['smtp_password'] = "{{GITLAB_EMAIL_PASSWORD}}"
        gitlab_rails['smtp_domain'] = "mail.aiursoft.com"
        gitlab_rails['smtp_authentication'] = "login"
        gitlab_rails['smtp_enable_starttls_auto'] = true
        gitlab_rails['smtp_tls'] = false
        gitlab_rails['smtp_openssl_verify_mode'] = 'none'
        gitlab_rails['gitlab_email_from'] = 'service@aiursoft.com'
        gitlab_rails['gitlab_email_reply_to'] = 'service@aiursoft.com'
        postgresql['max_service_checks'] = 240
        postgresql['service_check_interval'] = 5
        redis['max_service_checks'] = 240
        redis['service_check_interval'] = 5
    stop_grace_period: 280s
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80" ]
      interval: 60s
      timeout: 10s
      retries: 12
      start_period: 1200s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 7G
      update_config:
        order: stop-first
        delay: 60s

  runner_register:
    depends_on:
      - gitlab
    image: localhost:8080/box_starting/local_runner:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Use public endpoint so the jobrunner can access GitLab.
      # The actual jobrunner will not use the internal endpoint.
      - GITLAB_ENDPOINT=http://gitlab
      - GITLAB_RUNNER_TOKEN={{GITLAB_RUNNER_TOKEN}}
      - DOCKER_USERNAME={{DOCKER_HUB_USERNAME}}
      - DOCKER_PASSWORD={{DOCKER_HUB_PASSWORD}}
      - LOCAL_DOCKER_USERNAME={{LOCAL_DOCKER_USERNAME}}
      - LOCAL_DOCKER_PASSWORD={{LOCAL_DOCKER_PASSWORD}}
      - LOCAL_NUGET_API_KEY={{LOCAL_NUGET_PUBLISH_KEY}}
      - NUGET_API_KEY={{NUGET_API_KEY}}
    networks:
      - internal
      - proxy_app
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 4G
      replicas: 2
      update_config:
        order: start-first
        delay: 5s

  group_runner_register:
    depends_on:
      - gitlab
    image: localhost:8080/box_starting/local_runner:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - GITLAB_ENDPOINT=http://gitlab
      - GITLAB_RUNNER_TOKEN={{GITLAB_RUNNER_TOKEN_FOR_GROUP}}
      - DOCKER_USERNAME={{DOCKER_HUB_USERNAME}}
      - DOCKER_PASSWORD={{DOCKER_HUB_PASSWORD}}
      - LOCAL_DOCKER_USERNAME={{LOCAL_DOCKER_USERNAME}}
      - LOCAL_DOCKER_PASSWORD={{LOCAL_DOCKER_PASSWORD}}
      - LOCAL_NUGET_API_KEY={{LOCAL_NUGET_PUBLISH_KEY}}
      - NUGET_API_KEY={{NUGET_API_KEY}}
    networks:
      - internal
      - proxy_app
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 4G
      replicas: 2
      update_config:
        order: start-first
        delay: 5s

volumes:
  gitlab-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/gitlab/data
  gitlab-log:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/gitlab/log
  gitlab-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/gitlab/config

networks:
  proxy_app:
    external: true
  internal:
    driver: overlay
