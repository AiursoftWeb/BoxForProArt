version: '3.9'

services:
  app:
    image: hub.aiursoft.com/m986883511/paddleocr:api
    shm_size: 8g
    environment:
      - CUDA_VISIBLE_DEVICES=-1
      - NVIDIA_VISIBLE_DEVICES=none
      - USE_GPU=0
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - ENABLE_MKLDNN=True
      - CPU_NUM_THREADS=4
    networks:
      - proxy_app
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
      update_config:
        order: start-first
        delay: 5s

networks:
  proxy_app:
    external: true
  internal:
    driver: overlay
