version: "3.8"

services:
  speeches:
    image: hub.aiursoft.com/aiursoft/speeches:latest
    networks:
      - proxy_app
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
      update_config:
        order: stop-first
        delay: 60s

networks:
  proxy_app:
    external: true
