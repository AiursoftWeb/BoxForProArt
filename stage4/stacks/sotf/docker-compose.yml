version: '3.9'

services:
  sotf-server:
    image: hub.aiursoft.com/jammsen/sons-of-the-forest-dedicated-server:latest
    environment:
      - ALWAYS_UPDATE_ON_START=true
      - SKIP_NETWORK_ACCESSIBILITY_TEST=true
      - FILTER_SHADER_AND_MESH_AND_WINE_DEBUG=true  # <--- 官方新增：彻底屏蔽烦人的显卡/声卡报错日志
      - PUID=1000
      - PGID=1000
    volumes:
      - game:/sonsoftheforest          # <--- 核心修复1：直接挂载到游戏根目录
    networks:
      - frp_net
    ports:
      # These ports are for internal use. For external, FRP will handle it.
      - target: 8766
        published: 8766
        protocol: udp
        mode: host
      - target: 27016
        published: 27016
        protocol: udp
        mode: host
      - target: 9700
        published: 9700
        protocol: udp
        mode: host
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 16G
      update_config:
        order: stop-first
        delay: 60s

volumes:
  game:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/gaming/sotf-data/game

networks:
  frp_net:
    external: true
