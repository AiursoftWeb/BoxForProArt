version: '3.9'

services:
  app:
    image: hub.aiursoft.com/m986883511/paddleocr:api
    networks:
      - proxy_app
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          generic_resources:
            - discrete_resource_spec:
                kind: "NVIDIA-GPU"
                value: 0
      update_config:
        order: start-first
        delay: 5s

networks:
  proxy_app:
    external: true
  internal:
    driver: overlay
