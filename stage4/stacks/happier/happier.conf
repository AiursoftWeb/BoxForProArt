happier.aiursoft.com {
    log
    import hsts
    import limit_to_cloudflare
    encode br gzip

    # Happier authenticates its own browser, CLI and daemon connections.
    # An interactive forward_auth gateway would also intercept API/WebSockets.
    # Caddy forwards Socket.IO polling and WebSocket upgrades on /v1/updates.
    reverse_proxy http://happier_relay:3005
}
