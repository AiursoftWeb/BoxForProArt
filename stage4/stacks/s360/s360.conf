# S360
s360.aiursoft.com {
    log {
        output file /data/caddy/logs/web.log {
            roll_size 1gb
            roll_at 00:00 04:00 08:00 12:00 16:00 20:00
            roll_keep 5
            roll_keep_for 24h
            roll_uncompressed
        }
        format filter {
            wrap json
            fields {
                request>headers>X-S360-Key delete
            }
        }
    }
    import hsts
    import limit_to_cloudflare
    encode br gzip
    reverse_proxy http://s360_app:5000 {
    }
}
