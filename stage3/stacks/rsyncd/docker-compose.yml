version: '3.9'

services:
  server:
    image: localhost:8080/box_starting/local_ubuntu
    command: >
      sh -c "
        apt-get update && apt-get install -y rsync &&
        mkdir -p /etc/rsyncd &&
        echo '[zot-data]
        path = /data
        read only = yes
        list = yes
        uid = root
        gid = root' > /etc/rsyncd/rsyncd.conf &&
        rsync --daemon --no-detach --config=/etc/rsyncd/rsyncd.conf --port=873
      "
    ports:
      - target: 873
        published: 873
        protocol: tcp
        mode: host
    volumes:
      - zot-data:/data:ro
    networks:
      - frp_net
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
      update_config:
        order: stop-first
        delay: 60s

volumes:
  zot-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/zot-data

networks:
  frp_net:
    external: true
