ollama.aiursoft.com {
    log
    import hsts
    import limit_to_cloudflare
    encode br gzip
    reverse_proxy http://ai_ollama-gateway-app:5000
}

# Untrusted
openweb.aiursoft.com {
    log
    import hsts
    import limit_to_cloudflare
    encode br gzip
    # The app enforces 100 MiB per file; allow 1 MiB for multipart framing.
    @file_upload {
        method POST
        path /api/v1/files /api/v1/files/
    }
    @oversized_file_upload {
        method POST
        path /api/v1/files /api/v1/files/
        expression `{http.request.header.Content-Length} != null && {http.request.header.Content-Length} != '' && int({http.request.header.Content-Length}) > 105906176`
    }
    respond @oversized_file_upload 413
    request_body @file_upload {
        max_size 101MiB
    }
    reverse_proxy http://ai_open-webui:8080
}
