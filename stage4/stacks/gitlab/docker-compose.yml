version: '3.9'

services:
  gitlab:
    image: hub.aiursoft.com/gitlab/gitlab-ee:19.4.5-ee.0
    ports:
      - target: 2202
        published: 2202
        protocol: tcp
        mode: host
    networks:
      - proxy_app
      - internal
      - frp_net
    volumes:
      # Match Docker service update's source/target ordering to avoid replacement.
      - type: bind
        source: /dev/shm
        target: /dev/shm
        read_only: false
      - /etc/localtime:/etc/localtime:ro
      - gitlab-config:/etc/gitlab
      - gitlab-data:/var/opt/gitlab
      - gitlab-log:/var/log/gitlab
    tmpfs:
      - /tmp:size=4096m
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.aiursoft.com'
        gitlab_rails['gitlab_shell_ssh_port'] = 2202
        gitlab_rails['gitlab_ssh_host'] = 'ssh.aiursoft.com'
        gitlab_sshd['enable'] = true
        gitlab_sshd['listen_address'] = '[::]:2202'
        gitlab_rails['gitlab_default_theme'] = 2
        letsencrypt['enabled'] = false
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        nginx['redirect_http_to_https'] = false
        nginx['proxy_protocol'] = false
        nginx['http2_enabled'] = true
        nginx['real_ip_trusted_addresses'] = ['10.0.0.0/8']
        nginx['real_ip_header'] = 'X-Forwarded-For'
        nginx['real_ip_recursive'] = 'on'
        nginx['client_max_body_size'] = '10240m'
        gitlab_rails['omniauth_allow_single_sign_on'] = ['openid_connect']
        gitlab_rails['omniauth_sync_email_from_provider'] = 'openid_connect'
        gitlab_rails['omniauth_sync_profile_from_provider'] = ['openid_connect']
        gitlab_rails['omniauth_sync_profile_attributes'] = ['email']
        gitlab_rails['omniauth_auto_sign_in_with_provider'] = 'openid_connect'
        gitlab_rails['omniauth_block_auto_created_users'] = false
        gitlab_rails['omniauth_auto_link_user'] = ['openid_connect']
        gitlab_rails['omniauth_allow_bypass_two_factor'] = ['openid_connect']
        gitlab_rails['omniauth_providers'] = [
          {
            name: 'openid_connect',
            label: 'Aiursoft Login',
            args: {
              name: 'openid_connect',
              scope: ['openid','profile','email','groups'],
              response_type: 'code',
              issuer: 'https://auth.aiursoft.com/application/o/gitlab/',
              discovery: true,
              client_auth_method: 'query',
              uid_field: 'preferred_username',
              send_scope_to_token_endpoint: 'true',
              pkce: true,
              client_options: {
                identifier: '{{GITLAB_CLIENT_ID}}',
                secret: '{{GITLAB_CLIENT_SECRET}}',
                redirect_uri: 'https://gitlab.aiursoft.com/users/auth/openid_connect/callback',
                gitlab: {
                  admin_groups: ["gitlab-admins"],
                  groups_attribute: "groups"
                }
              }
            }
          }
        ]
        puma['worker_processes'] = 2
        puma['min_threads'] = 1
        puma['max_threads'] = 4
        puma['exporter_enabled'] = false
        sidekiq['concurrency'] = 10
        sidekiq['max_concurrency'] = 10
        sidekiq['min_concurrency'] = nil
        sidekiq['metrics_enabled'] = false
        postgresql['shared_buffers'] = "256MB"
        prometheus['enable'] = false
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false
        node_exporter['enable'] = false
        gitlab_exporter['enable'] = false
        gitlab_rails['smtp_enable'] = true
        gitlab_rails['smtp_address'] = "mail.aiursoft.com"
        gitlab_rails['smtp_port'] = 587
        gitlab_rails['smtp_user_name'] = "service@aiursoft.com"
        gitlab_rails['smtp_password'] = "{{GITLAB_EMAIL_PASSWORD}}"
        gitlab_rails['smtp_domain'] = "mail.aiursoft.com"
        gitlab_rails['smtp_authentication'] = "login"
        gitlab_rails['smtp_enable_starttls_auto'] = true
        gitlab_rails['smtp_tls'] = false
        gitlab_rails['smtp_openssl_verify_mode'] = 'none'
        gitlab_rails['gitlab_email_from'] = 'service@aiursoft.com'
        gitlab_rails['gitlab_email_reply_to'] = 'service@aiursoft.com'
        postgresql['max_service_checks'] = 240
        postgresql['service_check_interval'] = 5
        redis['max_service_checks'] = 240
        redis['service_check_interval'] = 5
    stop_grace_period: 280s
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80" ]
      interval: 60s
      timeout: 10s
      retries: 12
      start_period: 1200s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '6.0'
          memory: 24G
      update_config:
        order: stop-first
        delay: 60s

  runner_register:
    depends_on:
      - gitlab
    image: localhost:8080/box_starting/local_runner:latest
    hostname: "{{.Service.Name}}-{{.Task.Slot}}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gitlab-runner-data:/runner-data
    environment:
      # Use public endpoint so the jobrunner can access GitLab.
      # The actual jobrunner will not use the internal endpoint.
      # All runners and the shared BuildKit use these same 14 logical CPUs.
      - CI_CPUSET=4-17
      - CI_TASK_ID={{.Task.ID}}
      - GITLAB_ENDPOINT=http://gitlab
      - GITLAB_RUNNER_TOKEN={{GITLAB_RUNNER_TOKEN}}
      - REGISTRY_HOST={{REGISTRY_HOST}}
      - REGISTRY_VERIFICATION_IMAGE={{REGISTRY_VERIFICATION_IMAGE}}
      - DOCKER_USERNAME={{PUBLIC_DOCKER_HUB_USERNAME}}
      - DOCKER_PASSWORD={{PUBLIC_DOCKER_HUB_PASSWORD}}
      - DOCKERHUB_USERNAME={{DOCKERHUB_USERNAME}}
      - DOCKERHUB_PASSWORD={{DOCKERHUB_PASSWORD}}
      - CN_DOCKER_USERNAME={{CN_DOCKER_USERNAME}}
      - CN_DOCKER_PASSWORD={{CN_DOCKER_PASSWORD}}
      - LOCAL_NUGET_API_KEY={{LOCAL_NUGET_PUBLISH_KEY}}
      - NUGET_API_KEY={{NUGET_API_KEY}}
      - APKG_DEV_API_KEY={{APKG_DEV_API_KEY}}
      - APKG_PROD_API_KEY={{APKG_PROD_API_KEY}}
      - S360_SERVER=https://s360.aiursoft.com
      - S360_BASELINE_KEY={{S360_BASELINE_KEY}}
    networks:
      - internal
      - proxy_app
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 12G
      replicas: 7
      update_config:
        order: start-first
        delay: 5s

  group_runner_register:
    depends_on:
      - gitlab
    image: localhost:8080/box_starting/local_runner:latest
    hostname: "{{.Service.Name}}-{{.Task.Slot}}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gitlab-runner-data:/runner-data
    environment:
      # All runners and the shared BuildKit use these same 14 logical CPUs.
      - CI_CPUSET=4-17
      - CI_TASK_ID={{.Task.ID}}
      - GITLAB_ENDPOINT=http://gitlab
      - GITLAB_RUNNER_TOKEN={{GITLAB_RUNNER_TOKEN_FOR_GROUP}}
      - REGISTRY_HOST={{REGISTRY_HOST}}
      - REGISTRY_VERIFICATION_IMAGE={{REGISTRY_VERIFICATION_IMAGE}}
      - DOCKER_USERNAME={{PUBLIC_DOCKER_HUB_USERNAME}}
      - DOCKER_PASSWORD={{PUBLIC_DOCKER_HUB_PASSWORD}}
      - DOCKERHUB_USERNAME={{DOCKERHUB_USERNAME}}
      - DOCKERHUB_PASSWORD={{DOCKERHUB_PASSWORD}}
      - CN_DOCKER_USERNAME={{CN_DOCKER_USERNAME}}
      - CN_DOCKER_PASSWORD={{CN_DOCKER_PASSWORD}}
      - LOCAL_NUGET_API_KEY={{LOCAL_NUGET_PUBLISH_KEY}}
      - NUGET_API_KEY={{NUGET_API_KEY}}
      - APKG_DEV_API_KEY={{APKG_DEV_API_KEY}}
      - APKG_PROD_API_KEY={{APKG_PROD_API_KEY}}
      - S360_SERVER=https://s360.aiursoft.com
      - S360_BASELINE_KEY={{S360_BASELINE_KEY}}
    networks:
      - internal
      - proxy_app
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 12G
      replicas: 7
      update_config:
        order: start-first
        delay: 5s

  runner_cleanup:
    image: localhost:8080/box_starting/local_runner_cleaner:latest
    volumes:
      - gitlab-runner-data:/runner-data
    environment:
      - CHECK_INTERVAL_SECONDS=1800
      - HIGH_WATERMARK_BYTES=107374182400
      - LOW_WATERMARK_BYTES=85899345920
    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
      update_config:
        order: stop-first

  agent-bot:
    image: hub.aiursoft.com/aiursoft/agentbot:latest
    volumes:
      # Match Docker service update's source/target ordering to avoid replacement.
      - agent-bot-log:/logs
      - agent-bot-workspace:/workspace
    environment:
      # Resolve the physical coding model in OllamaGateway, not in this deployment.
      - AgentBot__Engine=Copilot
      - AgentBot__Model=aiursoft-codex:latest
      - AgentBot__ReasoningEffort=xhigh
      - COPILOT_PROVIDER_MAX_PROMPT_TOKENS=922000
      - COPILOT_PROVIDER_MAX_OUTPUT_TOKENS=128000
      - COPILOT_PROVIDER_WIRE_API=responses
      - COPILOT_OFFLINE=true
      - BOT_REPLY_LANGUAGE=zh
      - AgentBot__ApiKey={{AGENT_BOT_API_KEY}}
      - AgentBot__ApiEndpoint=https://ollama.aiursoft.com/v1
      - AgentBot__WorkspaceFolder=/workspace
      - Servers__0__Provider=GitLab
      - Servers__0__EndPoint=https://gitlab.aiursoft.com
      - Servers__0__PushEndPoint=https://{0}@gitlab.aiursoft.com
      - Servers__0__DisplayName=Agent Bot
      - Servers__0__UserName=gemini-bot
      - Servers__0__UserEmail=agent@aiursoft.com
      - Servers__0__ContributionBranch=users/agent/auto-fix-issue
      - Servers__0__Token={{AGENT_BOT_GITLAB_TOKEN}}
    networks:
      - proxy_app
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s

volumes:
  gitlab-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ssd/gitlab/data
  gitlab-log:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ssd/gitlab/log
  gitlab-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ssd/gitlab/config
  gitlab-runner-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ssd/gitlab/runner-data
  agent-bot-workspace:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ssd/agent-bot/workspace
  agent-bot-log:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ssd/agent-bot/log

networks:
  proxy_app:
    external: true
  internal:
    driver: overlay
  frp_net:
    external: true
