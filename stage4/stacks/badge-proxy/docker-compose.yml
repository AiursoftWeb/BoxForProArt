version: '3.9'

services:
  app:
    image: hub.aiursoft.com/aiursoft/internalimages/badge-proxy:latest
    environment:
      - GITLAB_URL=http://gitlab_gitlab
      - GITLAB_ACCESS_TOKEN={{BADGE_PROXY_GITLAB_TOKEN}}
    networks:
      - proxy_app
    stop_grace_period: 20s
    deploy:
      replicas: 1
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
      update_config:
        order: start-first
        delay: 5s

networks:
  proxy_app:
    external: true
