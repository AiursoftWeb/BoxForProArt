# Untrusted.
immich.aiursoft.com {
    log
    import hsts
    import limit_to_cloudflare
    encode br gzip
    @head_root {
        method HEAD
        path /
    }

    handle @head_root {
        respond "" 200
    }
    reverse_proxy http://immich_immich-server:2283 {
    }
}

ranking.anduinlab.com {
    log
    import hsts
    import limit_to_cloudflare
    encode br gzip

    redir /outpost.goauthentik.io/sign_out /sign-out
    # The application listens here only with native OIDC enabled.
    reverse_proxy http://immich_ranking:5001
}
