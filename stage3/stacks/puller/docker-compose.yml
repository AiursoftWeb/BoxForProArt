version: '3.9'

services:
  downloader:
    image: localhost:8080/box_starting/local_puller
    environment:
      - MIRROR_TARGET=hub.aiursoft.com
      - DOCKER_USERNAME={{DOCKER_HUB_USERNAME}}
      - DOCKER_PASSWORD={{DOCKER_HUB_PASSWORD}}
      - LOCAL_DOCKER_USERNAME={{LOCAL_DOCKER_USERNAME}}
      - LOCAL_DOCKER_PASSWORD={{LOCAL_DOCKER_PASSWORD}}
    volumes:
      - sync_records:/app/sync_records
      - run_logs:/app/run_logs
    networks:
      - proxy_app
    stop_grace_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: start-first
        delay: 5s

  downloader_cn:
    image: localhost:8080/box_starting/local_puller_cn
    environment:
      - FROM_REGISTRY=hub.aiursoft.com
      - MIRROR_TARGET=hub.aiursoft.cn
      - DOCKER_USERNAME={{LOCAL_DOCKER_USERNAME}}
      - DOCKER_PASSWORD={{LOCAL_DOCKER_PASSWORD}}
      - LOCAL_DOCKER_USERNAME={{CN_DOCKER_USERNAME}}
      - LOCAL_DOCKER_PASSWORD={{CN_DOCKER_PASSWORD}}
      - COPY_TIMEOUT_SECONDS=14400
      - MAX_ATTEMPTS=2
      # Cron runs every 8h; 7.5h avoids boundary skips caused by run duration.
      - PUBLIC_CHECK_INTERVAL_SECONDS=27000
      - INTERNAL_CHECK_INTERVAL_SECONDS=27000
    volumes:
      - sync_records_cn:/app/sync_records
      - run_logs_cn:/app/run_logs
    networks:
      - proxy_app
    stop_grace_period: 90s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: start-first
        delay: 5s

networks:
  proxy_app:
    external: true

volumes:
  sync_records:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/puller-data/sync_records
  sync_records_cn:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/puller-data/sync_records_cn
  run_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/puller-data/run_logs
  run_logs_cn:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/puller-data/run_logs_cn
