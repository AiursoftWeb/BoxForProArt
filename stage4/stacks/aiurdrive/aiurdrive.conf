# AiurDrive
drive.aiursoft.com {
    log
    import hsts
    import limit_to_cloudflare
    encode br gzip
    reverse_proxy http://aiurdrive_app:5000 {
    }
}

drive-files.aiursoft.com {
    log
    import hsts
    import limit_to_cloudflare
    encode br gzip

    @downloads path /download /download/* /download-private /download-private/*
    handle @downloads {
        reverse_proxy http://aiurdrive_app:5000 {
        }
    }

    handle {
        respond 404
    }
}
