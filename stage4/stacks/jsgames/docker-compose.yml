version: '3.9'

services:

  ipcalc:
    image: hub.aiursoft.com/anduin/ipcalc:latest
    networks:
      - proxy_app
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
      update_config:
        order: start-first
        delay: 5s

  aoe:
    image: hub.aiursoft.com/anduin/aoemini:latest
    networks:
      - proxy_app
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
      update_config:
        order: start-first
        delay: 5s

networks:
  proxy_app:
    external: true