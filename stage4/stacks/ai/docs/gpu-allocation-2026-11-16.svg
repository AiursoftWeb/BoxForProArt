<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850"><rect width="1600" height="850" fill="#f2f5fa"/><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#17243b}</style><text x="62" y="65" font-size="32" style="fill:#17243b" font-weight="700">Proart · 新分卡实测：ASR 留卡 0，bge + TTS 放卡 1</text><text x="64" y="103" font-size="19" style="fill:#5d6c84">完成推理后的同一时刻驻留快照 · 每张外框 = 24 GiB，面积严格对应 MiB；测试最低余量另列。</text><rect x="64.000" y="130.000" width="18.000" height="18.000" fill="#2563eb" rx="4"/><text x="91" y="146" font-size="17" style="fill:#17243b">vLLM（主模型 / 草稿 / 缓存）</text><rect x="424.000" y="130.000" width="18.000" height="18.000" fill="#9b6bdb" rx="4"/><text x="451" y="146" font-size="17" style="fill:#17243b">bge-m3 · 4K</text><rect x="654.000" y="130.000" width="18.000" height="18.000" fill="#e47ca4" rx="4"/><text x="681" y="146" font-size="17" style="fill:#17243b">ASR · FP16</text><rect x="874.000" y="130.000" width="18.000" height="18.000" fill="#f5a623" rx="4"/><text x="901" y="146" font-size="17" style="fill:#17243b">IndexTTS</text><rect x="1064.000" y="130.000" width="18.000" height="18.000" fill="#b2bdcc" rx="4"/><text x="1091" y="146" font-size="17" style="fill:#17243b">驱动及其他</text><rect x="1284.000" y="130.000" width="18.000" height="18.000" fill="#59ccaa" rx="4"/><text x="1311" y="146" font-size="17" style="fill:#17243b">剩余</text><text x="64" y="200" font-size="23" style="fill:#17243b" font-weight="700">GPU 0：常驻 ASR + vLLM 一半</text><text x="816" y="200" font-size="23" style="fill:#17243b" font-weight="700">GPU 1：bge + TTS + vLLM 另一半</text><rect x="64.000" y="224.000" width="720.000" height="376.000" fill="#fff" rx="18"/><text x="88" y="267" font-size="25" style="fill:#17243b" font-weight="700">GPU 0</text><text x="209" y="266" font-size="17" style="fill:#718096">24 GiB / 24576 MiB</text><text x="489" y="267" font-size="19" style="fill:#137b62" font-weight="700">快照剩余 875 MiB</text><rect x="88.000" y="291.000" width="525.438" height="252.000" fill="#2563eb" rx="0"/><text x="113" y="353" font-size="27" style="fill:#fff" font-weight="700">vLLM · TP 0</text><text x="113" y="397" font-size="18" style="fill:#fff">主模型 + DFlash + 视觉 / KV 工作区</text><text x="113" y="445" font-size="26" style="fill:#fff">19216 MiB / 18.77 GiB</text><text x="113" y="486" font-size="20" style="fill:#d9e8ff">78.2%</text><rect x="613.438" y="291.000" width="146.562" height="188.906" fill="#e47ca4" rx="0"/><text x="623.4375" y="382.4529850746269" font-size="15" style="fill:#17243b" font-weight="700">ASR · 常驻</text><text x="623.4375" y="404.4529850746269" font-size="16" style="fill:#17243b">4018 MiB</text><rect x="613.438" y="479.906" width="146.562" height="21.956" fill="#b2bdcc" rx="0"/><text x="620.4375" y="495.8839552238806" font-size="12" style="fill:#17243b">其他 467 MiB</text><rect x="613.438" y="501.862" width="146.562" height="41.138" fill="#59ccaa" rx="0"/><text x="623.4375" y="519.4309701492538" font-size="15" style="fill:#17243b" font-weight="700">可用</text><text x="623.4375" y="541.4309701492538" font-size="16" style="fill:#17243b">875 MiB</text><text x="88" y="574" font-size="18" style="fill:#b36c00" font-weight="700">整个共存窗口最低剩余：619 MiB</text><rect x="816.000" y="224.000" width="720.000" height="376.000" fill="#fff" rx="18"/><text x="840" y="267" font-size="25" style="fill:#17243b" font-weight="700">GPU 1</text><text x="961" y="266" font-size="17" style="fill:#718096">24 GiB / 24576 MiB</text><text x="1241" y="267" font-size="19" style="fill:#137b62" font-weight="700">快照剩余 1582 MiB</text><rect x="840.000" y="291.000" width="525.438" height="252.000" fill="#2563eb" rx="0"/><text x="865" y="353" font-size="27" style="fill:#fff" font-weight="700">vLLM · TP 1</text><text x="865" y="397" font-size="18" style="fill:#fff">主模型 + DFlash + 视觉 / KV 工作区</text><text x="865" y="445" font-size="26" style="fill:#fff">19216 MiB / 18.77 GiB</text><text x="865" y="486" font-size="20" style="fill:#d9e8ff">78.2%</text><rect x="1365.438" y="291.000" width="146.562" height="46.075" fill="#9b6bdb" rx="0"/><text x="1375.4375" y="311.03731343283584" font-size="15" style="fill:#17243b" font-weight="700">bge · 4K</text><text x="1375.4375" y="333.03731343283584" font-size="16" style="fill:#17243b">980 MiB</text><rect x="1365.438" y="337.075" width="146.562" height="109.357" fill="#f5a623" rx="0"/><text x="1375.4375" y="388.75298507462685" font-size="15" style="fill:#17243b" font-weight="700">TTS</text><text x="1375.4375" y="410.75298507462685" font-size="16" style="fill:#17243b">2326 MiB</text><rect x="1365.438" y="446.431" width="146.562" height="22.191" fill="#b2bdcc" rx="0"/><text x="1372.4375" y="462.52686567164176" font-size="12" style="fill:#17243b">其他 472 MiB</text><rect x="1365.438" y="468.622" width="146.562" height="74.378" fill="#59ccaa" rx="0"/><text x="1375.4375" y="502.8111940298507" font-size="15" style="fill:#17243b" font-weight="700">可用</text><text x="1375.4375" y="524.8111940298506" font-size="16" style="fill:#17243b">1582 MiB</text><text x="840" y="574" font-size="18" style="fill:#b36c00" font-weight="700">整个共存窗口最低剩余：210 MiB</text><text x="64" y="649" font-size="22" style="fill:#137b62" font-weight="700">实测完成：ASR 转写 32 秒音频、TTS 真实合成 43 秒音频、1024 维嵌入、聊天；无 OOM。</text><text x="64" y="692" font-size="18" style="fill:#17243b">bge 移到 GPU 1，给 GPU 0 腾出了约 970 MiB；ASR 推理后继续常驻，不再等请求触发加载。</text><text x="64" y="733" font-size="18" style="fill:#b36c00">最低余量 GPU 0 / GPU 1 = 619 / 210 MiB。GPU 1 冷 TTS 峰值更紧，快照剩余量不能当成全程最低。</text><text x="64" y="774" font-size="17" style="fill:#5d6c84">Box 声明：ASR → GPU 0；bge 4K + TTS → GPU 1；vLLM → TP 2 / 16K。通用 deploy.sh 保持不变。</text><text x="64" y="814" font-size="16" style="fill:#5d6c84">本图来自临时实机验收；验收后恢复原配置。MR 合并、WhisperX 新镜像发布并部署三个栈后永久生效。</text></svg>