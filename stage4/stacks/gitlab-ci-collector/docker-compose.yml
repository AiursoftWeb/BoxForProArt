version: '3.9'

services:
  app:
    image: hub.aiursoft.com/aiursoft/internalimages/gitlab-ci-collector:latest
    environment:
      - GITLAB_URL=https://gitlab.aiursoft.com
      - GITLAB_SOURCE=gitlab.aiursoft.com
      - GITLAB_GROUPS=aiursoft
      - GITLAB_ACCESS_TOKEN={{GITLAB_CI_COLLECTOR_TOKEN}}
      - CLICKHOUSE_URL=http://clickhouse_clickhouse:8123
      - CLICKHOUSE_DATABASE=GitLabMetrics
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=123456
    networks:
      - clickhouse_net
    healthcheck:
      start_period: 6h
    stop_grace_period: 60s
    deploy:
      replicas: 1
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
      update_config:
        order: stop-first
        delay: 60s

networks:
  clickhouse_net:
    external: true
