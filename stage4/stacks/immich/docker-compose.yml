version: '3.9'

# DB_DATA_LOCATION=./postgres

# # To set a timezone, uncomment the next line and change Etc/UTC to a TZ identifier from this list: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List
# # TZ=Etc/UTC

# # The Immich version to use. You can pin this to a specific version like "v1.71.0"

# # Connection secret for postgres. You should change it to a random password
# # Please use only the characters `A-Za-z0-9`, without special characters or spaces
# DB_PASSWORD=postgres

# # The values below this line do not need to be changed
# ###################################################################################
# DB_USERNAME=postgres
# DB_DATABASE_NAME=immich

services:
  immich-server:
    depends_on:
      - redis
      - database
    image: hub.aiursoft.com/ghcr.io/immich-app/immich-server:release
    volumes:
      - upload-location:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
      - external:/external
    environment:
      - TZ=UTC
      - DB_DATABASE_NAME=immich_db
      - DB_USERNAME=immich_db_user
      - DB_PASSWORD=immich_db_password
    networks:
      - internal
      - proxy_app
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '8.0'
          memory: 12G
      update_config:
        order: stop-first
        delay: 60s

  immich-machine-learning:
    depends_on:
      - redis
      - database
    image: hub.aiursoft.com/ghcr.io/immich-app/immich-machine-learning:release
    volumes:
      - model-cache:/cache
    environment:
      - TZ=UTC
      - DB_DATABASE_NAME=immich_db
      - DB_USERNAME=immich_db_user
      - DB_PASSWORD=immich_db_password
    networks:
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '8.0'
          memory: 12G
      update_config:
        order: stop-first
        delay: 60s

  redis:
    image: hub.aiursoft.com/valkey/valkey:8-bookworm
    volumes:
      - redis:/data
    networks:
      - internal
    stop_grace_period: 60s
    healthcheck:
      test: redis-cli ping || exit 1
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
      update_config:
        order: stop-first
        delay: 60s

  ranking:
    image: hub.aiursoft.com/anduin/photoranking
    volumes:
      - external:/photos
      - ranking-data:/data
    environment:
      - TZ=UTC
      - PhotoRootPath=/photos
      - RankingOidc__Authority=https://auth.aiursoft.com/application/o/photoranking/
      - RankingOidc__PublicOrigin=https://ranking.anduinlab.com
      - RankingOidc__ClientId=photoranking
      - RankingOidc__ClientSecret={{RANKING_OIDC_CLIENT_SECRET}}
      - Summary__Endpoint=https://ollama.aiursoft.com/api/chat
      - Summary__Model=aiursoft-localization:latest
      - Summary__ApiKey={{PHOTORANKING_AI_TOKEN}}
      - Tts__Endpoint=https://tts.aiursoft.com/api/tts
      - Tts__Model=broadcasting
      - Tts__Voice=
      - Tts__ApiKey={{TTS_ACCESS_TOKEN}}
    networks:
      - proxy_app
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '20.0'
          memory: 8G
      update_config:
        order: stop-first
        delay: 60s

  database:
    image: hub.aiursoft.com/ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: immich_db_password
      POSTGRES_USER: immich_db_user
      POSTGRES_DB: immich_db
      POSTGRES_INITDB_ARGS: '--data-checksums'
    networks:
      - internal
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
      update_config:
        order: stop-first
        delay: 60s


networks:
  internal:
    driver: overlay
  proxy_app:
    external: true


volumes:
  upload-location:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/hdd/immich/upload
  external:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/hdd/immich/external
  model-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ssd/immich/model-cache
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ssd/immich/db-data
  redis:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ssd/immich/redis
  ranking-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ssd/immich/ranking-data
