version: '3.9'

services:
  sites:
    image: localhost:8080/box_starting/local_sites
    ports:
      # These ports are for internal use. For external, FRP will handle it.
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    networks:
      proxy_app:
        aliases:
          # Network aliases for internal DNS resolution
          # Allows internal services to resolve these domains directly to Caddy
          # without needing to go through Cloudflare or modify /etc/hosts
          ---DOMAINS---
      frp_net:
    environment:
      # Cloudflare API token for Let's Encrypt DNS-01 challenge
      # Create token at: Cloudflare Dashboard -> My Profile -> API Tokens
      # Required permissions: Zone:DNS:Edit for target zones
      - CLOUDFLARE_API_TOKEN={{CLOUDFLARE_API_TOKEN}}
      - ALLOW_INCOMING_IPS={{FRP_SERVER}}
    volumes:
      - sites-data:/data
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 16G
      update_config:
        order: stop-first
        delay: 60s
    # Do NOT auto redeploy this. Because this is built locally.
    # Every time we run the deploy.sh will update the image.
    # During incidents, we may need to manually ssh into the server and restart the service.

  pysyncer:
    image: localhost:8080/box_starting/local_pysyncer
    networks:
      - clickhouse_net
    volumes:
      - sites-data:/data:ro
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
      update_config:
        order: stop-first
        delay: 60s

  frpc_ningbo:
    image: localhost:8080/box_starting/local_frp
    networks:
      - frp_net
    environment:
      - FRP_SERVER={{FRP_SERVER}}
      - FRP_TOKEN={{FRP_TOKEN}}
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
      update_config:
        order: stop-first
        delay: 60s

  frp_monitor:
    image: localhost:8080/box_starting/local_frp_monitor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - SERVICE_NAMES=frpc_ningbo
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
      update_config:
        order: stop-first

volumes:
  sites-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/ssd/sites-data

networks:
  proxy_app:
    external: true
  clickhouse_net:
    external: true
  frp_net:
    external: true
