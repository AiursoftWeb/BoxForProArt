stages:
  - lint

lint-compose:
  stage: lint
  image: python:3.13
  before_script:
    - python3 -m pip install --disable-pip-version-check pyyaml
  script:
    - python3 ./lint.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
