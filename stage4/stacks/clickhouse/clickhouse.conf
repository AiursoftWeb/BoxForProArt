clickhouse-proart.aiursoft.com {
    log
    import hsts
    import limit_to_cloudflare
    encode br gzip
    
    route {
        reverse_proxy /outpost.goauthentik.io/* http://clickhouse_authentik_proxy:9000 {
            header_up Host {http.reverse_proxy.upstream.host}
        }

        forward_auth http://clickhouse_authentik_proxy:9000 {
            uri     /outpost.goauthentik.io/auth/caddy
            copy_headers X-Authentik-Username X-Authentik-Groups X-Authentik-Entitlements X-Authentik-Email X-Authentik-Name X-Authentik-Uid X-Authentik-Jwt X-Authentik-Meta-Jwks X-Authentik-Meta-Outpost X-Authentik-Meta-Provider X-Authentik-Meta-App X-Authentik-Meta-Version
        }

        # --- 魔法清洗区域 ---
        # 针对 ClickHouse /play 界面默认带的无用认证参数进行精确剥离
        uri replace "?user=default&" "?"
        uri replace "&user=default" ""
        uri replace "?user=default" ""
        
        # /play 界面有时也会带上空的 password 参数，一并洗掉
        uri replace "?password=&" "?"
        uri replace "&password=" ""
        uri replace "?password=" ""
        # --- 洗净完毕 ---

        reverse_proxy http://clickhouse_clickhouse:8123 {
            header_up X-ClickHouse-User "default"
            header_up X-ClickHouse-Key "123456"
        }
    }
}