version: '3.9'

services:
  app:
    depends_on:
      - db
    image: hub.aiursoft.com/aiursoft/cpprunner
    volumes:
      - cpprunner-aspnet:/data/.aspnet
      - cpprunner-files:/data/files
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    environment:
      - DockerImageSettings__Prefix=hub.aiursoft.com
      - ConnectionStrings__DefaultConnection=Server=db;Database=cpprunner;Uid=cpprunner;Pwd=<cpprunner_password>;
      - ConnectionStrings__DbType=MySql
      - Storage__Path=/data/files
      - AppSettings__AuthProvider=OIDC
      - AppSettings__OIDC__Authority=https://auth.aiursoft.com/application/o/cpp-runner
      - AppSettings__OIDC__ClientId={{CPPRUNNER_CLIENT_ID}}
      - AppSettings__OIDC__ClientSecret={{CPPRUNNER_CLIENT_SECRET}}
      - Logging__Clickhouse__Enabled=true
      - Logging__Clickhouse__ConnectionString=Host=clickhouse;User=default;Password=123456;Database=AspNetCoreLogs
      - Logging__Clickhouse__TableName=CppRunnerLogs
    networks:
      - proxy_app
      - internal
      - clickhouse_net
    stop_grace_period: 20s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
      update_config:
        order: start-first
        delay: 5s
  db:
    image: hub.aiursoft.com/mysql:9.7.0
    volumes:
      - cpprunner-db:/var/lib/mysql
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_DATABASE=cpprunner
      - MYSQL_USER=cpprunner
      - MYSQL_PASSWORD=<cpprunner_password>
    networks:
      - internal
    stop_grace_period: 60s
    deploy:
      labels:
        shepherd.autoupdate: "true"
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
      update_config:
        order: stop-first
        delay: 60s

volumes:
  cpprunner-aspnet:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/cpprunner/aspnet
  cpprunner-files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/cpprunner/files
  cpprunner-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/cpprunner/mysql

networks:
  proxy_app:
    external: true
  clickhouse_net:
    external: true
  internal:
    driver: overlay
