version: '3.9'

services:
  authentik_proxy:
    image: hub.aiursoft.com/ghcr.io/goauthentik/proxy:2026.2.1
    volumes:
      - type: bind
        source: /dev/shm
        target: /dev/shm
        read_only: false
    environment:
      AUTHENTIK_HOST: "https://auth.aiursoft.com/"
      AUTHENTIK_INSECURE: "false"
      AUTHENTIK_TOKEN: "{{WIKI_OUTPOST_TOKEN}}"
    networks:
      - proxy_app
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
      update_config:
        order: start-first
        delay: 5s

  app:
    image: hub.aiursoft.com/aiursoft/internalimages/kiwix
    networks:
      - proxy_app
    volumes:
      - kiwix-data:/data
    stop_grace_period: 20s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
      update_config:
        order: start-first
        delay: 5s

volumes:
  kiwix-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /swarm-vol/wiki-data

networks:
  proxy_app:
    external: true
